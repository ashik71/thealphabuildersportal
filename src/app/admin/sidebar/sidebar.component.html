<aside class="rail" [class.rail--open]="layout.sidebarOpen()">
  <div class="rail__brand">
    <app-logo-mark [size]="30" gap="var(--sb-panel-sunk)" class="rail__mark" />
    <div>
      <div class="rail__brand-name">Sukun</div>
      <div class="rail__brand-sub">Builders</div>
    </div>
  </div>

  <nav class="rail__nav">
    <div class="rail__nav-label">Manage</div>
    @for (item of navItems; track item.path) {
      <a
        class="rail__item"
        [routerLink]="item.path"
        routerLinkActive="rail__item--on"
        (click)="layout.closeSidebar()"
      >
        <mat-icon class="rail__icon">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="rail__foot">
    <button
      class="rail__theme-toggle"
      type="button"
      (click)="themeService.toggle()"
      [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <mat-icon class="rail__icon">{{ theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span>{{ theme() === 'dark' ? 'Light theme' : 'Dark theme' }}</span>
    </button>

    <button class="rail__who" [matMenuTriggerFor]="userMenu" type="button" aria-label="Account menu">
      <span class="rail__avatar">{{ initials() }}</span>
      <span class="rail__who-text">
        <span class="rail__name">{{ currentUser()?.name || 'Account' }}</span>
        <span class="rail__mail">{{ currentUser()?.email }}</span>
      </span>
    </button>
  </div>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</aside>
